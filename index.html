<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CONVERTIDOR EXCEL A TXT</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#1e293b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;padding:48px 16px}.card{max-width:780px;margin:auto;background:white;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 8px 30px #17233b0d}h1{margin:0 0 8px;font-size:27px}p{color:#64748b;line-height:1.5}.drop{display:block;border:2px dashed #94a3b8;border-radius:12px;padding:27px;text-align:center;cursor:pointer;margin:24px 0;background:#f8fafc}.drop strong{display:block;margin-bottom:8px}.drop input{display:none}button{background:#2358cb;color:white;font-size:15px;font-weight:600;border:0;border-radius:9px;padding:13px 20px;cursor:pointer}button:disabled{background:#94a3b8;cursor:not-allowed}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}#estado{font-size:14px;color:#475569}pre{overflow:auto;max-height:250px;padding:18px;background:#0f172a;color:#d3e4ff;border-radius:10px;font:12px/1.75 Consolas,monospace;white-space:pre}small{color:#64748b}.hidden{display:none}.error{color:#b91c1c!important}</style></head>
<body><main class="card"><h1>CONVERTIDOR EXCEL A TXT</h1>
<label class="drop" id="zona"><strong>Seleccionar un archivo Excel</strong><span id="nombre">Hacé clic o arrastrá un archivo .xlsx / .xls</span><input id="archivo" type="file" accept=".xlsx,.xls"></label>
<div class="actions"><button id="convertir" disabled>Convertir y descargar TXT</button><span id="estado">Seleccioná un archivo para comenzar.</span></div>
<section id="vista" class="hidden"><h3>Vista previa (primeras 5 líneas)</h3><pre id="previa"></pre><small id="resumen"></small></section>
</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
// CONFIGURACIÓN FIJA. Fuente: Lista_Preco_ME_IPS_Latina.
const COLUMNAS = [4,30,17,16,18,6]; // E, AE, R, Q, S, G (índices desde 0)
const SEPARADOR = '\t\t|\t\t'; // Respeta las tabulaciones del TXT modelo
const archivo = document.getElementById('archivo'), convertir=document.getElementById('convertir');
const estado=document.getElementById('estado'), previa=document.getElementById('previa'),vista=document.getElementById('vista');
let seleccionado=null;
function notificar(t,error=false){estado.textContent=t;estado.classList.toggle('error',error)}
function elegir(f){if(!f)return;seleccionado=f;document.getElementById('nombre').textContent=f.name;convertir.disabled=false;vista.classList.add('hidden');notificar('Archivo preparado para convertir.');}
archivo.addEventListener('change',e=>elegir(e.target.files[0]));
const zona=document.getElementById('zona');zona.addEventListener('dragover',e=>{e.preventDefault();zona.style.borderColor='#2358cb'});zona.addEventListener('dragleave',()=>zona.style.borderColor='');zona.addEventListener('drop',e=>{e.preventDefault();zona.style.borderColor='';elegir(e.dataTransfer.files[0])});
function textoCelda(c){if(!c)return '';return c.t==='s'||c.t==='str'?String(c.v??''):String(c.v??'')}
function numeroDecimal(c){if(!c||c.v==null||String(c.v).trim()==='')return '';return String(c.v).replace(',','.').trim()}
// Redondea decimales de precios a centavos usando decimal exacto en vez de errores binarios.
function precio(c){let v=numeroDecimal(c);if(!v)return '';let m=v.match(/^(-?)(\d+)(?:\.(\d+))?(?:[eE]([+-]?\d+))?$/);if(!m)return textoCelda(c).replace('.',',');
 let n=Number(v);if(!Number.isFinite(n))return '';let sign=n<0?'-':'';let s=Math.abs(n).toFixed(8);let [a,b='']=s.split('.');let cents=BigInt(a)*100n+BigInt((b+'00').slice(0,2));if(Number((b+'000').charAt(2))>=5)cents++;
 return sign+(cents/100n).toString()+','+(cents%100n).toString().padStart(2,'0');}
function peso(c){let v=numeroDecimal(c);if(!v)return '';let n=Number(v)/1000;if(!Number.isFinite(n))return '';return n.toFixed(9).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')}
function campo(c,i){if(i===2)return precio(c);if(i===5)return peso(c);return textoCelda(c)}
convertir.addEventListener('click',async()=>{
 if(!seleccionado)return;convertir.disabled=true;notificar('Procesando Excel…');
 try{
  if(typeof XLSX==='undefined')throw Error('No se pudo cargar la biblioteca para leer Excel. Verificá la conexión a Internet.');
  const data=await seleccionado.arrayBuffer();const libro=XLSX.read(data,{type:'array',dense:true,cellText:false});
  const hoja=libro.Sheets['Lista_Preco_ME_IPS_Latina']||libro.Sheets[libro.SheetNames[0]];
  if(!hoja)throw Error('No hay hojas disponibles en el archivo.');
  const matriz=hoja['!data']||XLSX.utils.sheet_to_json(hoja,{header:1,raw:true,defval:''});
  if(!matriz.length)throw Error('El Excel está vacío.');
  // Verificación de estructura para evitar archivos mal convertidos.
  const header=['Part Number','Description Language 4','Future Price','Future Disc. Group','Future MKT Code','Weight'];
  const esperado=['E','AE','R','Q','S','G'];
  for(let i=0;i<COLUMNAS.length;i++){
   const celda=matriz[0]?.[COLUMNAS[i]];
   const valor=(celda&&typeof celda==='object'&&'v'in celda?celda.v:celda)||'';
   if(String(valor).trim().toLowerCase()!==header[i].toLowerCase())throw Error('La estructura no coincide: columna '+esperado[i]+' debería ser «'+header[i]+'».');
  }
  const lineas=[];
  for(let r=1;r<matriz.length;r++){
   const fila=matriz[r]||[];
   let cols=COLUMNAS.map((idx,i)=>campo(fila[idx]&&typeof fila[idx]==='object'?fila[idx]:{v:fila[idx],t:typeof fila[idx]==='number'?'n':'s'},i));
   if(cols.every(v=>v===''))continue;
   lineas.push(cols.join(SEPARADOR));
  }
  const contenido=lineas.join('\r\n')+'\r\n';
  const blob=new Blob([contenido],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Brasilnew.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  previa.textContent=lineas.slice(0,5).join('\n');document.getElementById('resumen').textContent=lineas.length.toLocaleString('es-PY')+' registros generados';vista.classList.remove('hidden');notificar('TXT generado correctamente.');
 }catch(e){notificar(e.message||String(e),true);console.error(e)}finally{convertir.disabled=false}
});
</script></body></html>
